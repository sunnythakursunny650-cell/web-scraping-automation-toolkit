name: Scheduled Cloud Scraper

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scraper Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 fake-useragent pydantic pandas

      - name: Execute Async Scraping Pipeline
        run: |
          python async_scraper.py

      - name: Commit & Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scraped_warehouse.db
          git diff --staged --quiet || (git commit -m "chore(cron): auto-sync warehouse database [skip ci]" && git push origin main)